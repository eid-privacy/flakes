name: Build and push to Cachix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = relaxed

      - uses: cachix/cachix-action@v17
        with:
          name: eid-privacy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build default packages
        run: |
          SYSTEM=$(nix eval --impure --raw --expr builtins.currentSystem)
          # Enumerate all attributes under packages.<system> directly from the flake,
          # so new packages added to flake.nix are picked up automatically.
          for pkg in $(nix eval --json ".#packages.${SYSTEM}" --apply builtins.attrNames | jq -r '.[]'); do
            echo "::group::nix build .#${pkg}"
            nix build ".#packages.${SYSTEM}.\"${pkg}\""
            echo "::endgroup::"
          done

      - name: Build versioned packages
        run: |
          SYSTEM=$(nix eval --impure --raw --expr builtins.currentSystem)
          # Enumerate every version set under legacyPackages.<system> and every
          # version inside it, straight from the flake. Adding a new version in
          # flake.nix is enough — no need to touch this workflow.
          for set in $(nix eval --json ".#legacyPackages.${SYSTEM}" --apply builtins.attrNames | jq -r '.[]'); do
            for ver in $(nix eval --json ".#legacyPackages.${SYSTEM}.\"${set}\"" --apply builtins.attrNames | jq -r '.[]'); do
              echo "::group::nix build .#legacyPackages.${SYSTEM}.${set}.${ver}"
              nix build ".#legacyPackages.${SYSTEM}.\"${set}\".\"${ver}\""
              echo "::endgroup::"
            done
          done
